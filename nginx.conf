server {
    listen 8081;
    server_name _;

    # This file is kept only as an optional Nginx reference.
    # The Dockerfile currently uses docker/server.py so it can persist
    # shared leaderboard records to /data/scores.json.

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|json|wasm|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
